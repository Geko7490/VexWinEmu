name: VEX Win Android Runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android toolchain
        run: |
          sdk="$RUNNER_TEMP/vex-android-sdk"
          cli="$RUNNER_TEMP/android-cli.zip"
          mkdir -p "$sdk"
          curl --fail --silent --show-error --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$cli"
          printf '%s  %s\n' 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258 "$cli" | sha256sum -c
          unzip -q "$cli" -d "$RUNNER_TEMP/vex-android-cli"
          sdkmanager="$RUNNER_TEMP/vex-android-cli/cmdline-tools/bin/sdkmanager"
          "$sdkmanager" --sdk_root="$sdk" --licenses < <(yes) > /dev/null
          "$sdkmanager" --sdk_root="$sdk" 'platforms;android-35' 'platform-tools' 'build-tools;34.0.0' 'ndk;24.0.8215888' 'cmake;3.22.1'
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
      - name: Prepare Winlator source
        run: bash scripts/prepare-runtime.sh
      - name: Assemble ARM64 APK
        working-directory: work/winlator
        run: bash gradlew --no-daemon --max-workers=4 -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=768m" :app:assembleDebug
      - name: Verify and stage APK
        run: |
          mkdir -p dist
          apk=dist/VEX-Win-V0.1.1-Touch-arm64.apk
          cp work/winlator/app/build/outputs/apk/debug/app-debug.apk "$apk"
          build_tools="$ANDROID_HOME/build-tools/34.0.0"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/aapt" dump badging "$apk" | grep -F "name='com.winlator' versionCode='34' versionName='0.1.1-touch'"
          python3 scripts/verify-apk.py "$apk"
          cp LICENSE THIRD_PARTY.md dist/
          (cd dist && sha256sum VEX-Win-V0.1.1-Touch-arm64.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: VEX-Win-V0.1.1-Touch-arm64
          path: dist/
          compression-level: 0
          if-no-files-found: error
